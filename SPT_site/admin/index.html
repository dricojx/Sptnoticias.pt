<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Edição Central — SPT</title>
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #0b0f17; color: #f0f3f6; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
    .painel-box { max-width: 700px; width: 100%; background: #121824; padding: 35px; border-radius: 12px; border: 1px solid #1f293d; box-shadow: 0 8px 25px rgba(0,0,0,0.3); }
    h1 { color: #ffffff; font-size: 28px; margin-top: 0; margin-bottom: 5px; font-weight: 800; }
    p.sub { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .campo { margin-bottom: 22px; display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 12px; font-weight: 800; color: #94a3b8; letter-spacing: 1px; text-transform: uppercase; }
    input[type="text"], select, textarea { background: #0f141c; border: 2px solid #1f293d; color: #ffffff; padding: 14px; font-size: 16px; border-radius: 8px; font-family: inherit; width: 100%; box-sizing: border-box; }
    input[type="text"]:focus, select:focus, textarea:focus { outline: none; border-color: #0757ff; }
    textarea { height: 180px; resize: vertical; }
    
    /* ESTILO NOVO PARA A SELEÇÃO DE DESTACADOS */
    .zona-destaque { background: #1a2233; padding: 15px; border-radius: 8px; border: 1px dashed #24324d; margin-bottom: 22px; }
    .radio-group { display: flex; gap: 20px; margin-top: 5px; }
    .radio-option { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 15px; color: #ffffff; font-weight: 600; }
    .radio-option input { cursor: pointer; scale: 1.2; }

    .btn-disparar { background: #0757ff; color: #ffffff; font-size: 18px; font-weight: 900; padding: 18px; border: none; border-radius: 8px; cursor: pointer; width: 100%; box-shadow: 0 8px 25px rgba(7, 87, 255, 0.2); transition: all 0.2s; }
    .btn-disparar:hover { background: #0044cc; transform: translateY(-1px); }
  </style>
</head>
<body>

<div class="painel-box">
  <h1>Central de Emissão SPT</h1>
  <p class="sub">Preenche os dados para gerar o ficheiro de atualização do teu portal.</p>
  
  <form id="meu-form-noticia">
    
    <!-- NOVO: Escolha do local de exibição (Carrossel ou Lista) -->
    <div class="zona-destaque">
      <label>Onde queres exibir esta notícia?</label>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="tipo_exibicao" value="carrossel" checked>
          🌅 Substituir Notícia Principal (Carrossel / Hero)
        </label>
        <label class="radio-option">
          <input type="radio" name="tipo_exibicao" value="normal">
          📰 Adicionar às Notícias Normais (Grelha de Destaques)
        </label>
      </div>
    </div>

    <div class="campo">
      <label for="titulo">Título da Notícia / Manchete</label>
      <input type="text" id="titulo" placeholder="Introduz o título com impacto..." required>
    </div>

    <div class="campo">
      <label for="categoria">Categoria</label>
      <select id="categoria">
        <option value="Última Hora">Última Hora</option>
        <option value="País">País</option>
        <option value="Mundo">Mundo</option>
        <option value="Desporto">Desporto</option>
        <option value="Cultura">Cultura</option>
        <option value="Tecnologia">Tecnologia</option>
      </select>
    </div>

    <div class="campo">
      <label for="tempo">Hora de Exibição</label>
      <input type="text" id="tempo" value="Hoje · 12:00" placeholder="Ex: Hoje · 15:30" required>
    </div>

    <div class="campo">
      <label for="imagem">Link da Imagem (URL)</label>
      <input type="text" id="imagem" placeholder="Cola o link da imagem da notícia..." required>
    </div>

    <div class="campo">
      <label for="conteudo">Corpo da Notícia / Texto Completo</label>
      <textarea id="conteudo" placeholder="Começa a escrever o artigo da notícia aqui..." required></textarea>
    </div>

    <button type="submit" class="btn-disparar">⚡ Gerar Ficheiro de Publicação</button>
  </form>
</div>

<script>
  document.getElementById('meu-form-noticia').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Organiza os dados capturados do formulário
    const dadosNoticia = {
      tipo: document.querySelector('input[name="tipo_exibicao"]:checked').value,
      titulo: document.getElementById('titulo').value,
      categoria: document.getElementById('categoria').value,
      tempo_publicacao: document.getElementById('tempo').value,
      imagem_url: document.getElementById('imagem').value,
      conteudo: document.getElementById('conteudo').value
    };
    
    // Transforma os dados num ficheiro de texto JSON descarregável
    const dadosTexto = JSON.stringify(dadosNoticia, null, 2);
    const blob = new Blob([dadosTexto], { type: "application/json" });
    const link = document.createElement("a");
    
    link.href = URL.createObjectURL(blob);
    link.download = "dados.json"; // Nome fixo que o teu app.js vai ler
    
    // Dispara o download automático no teu navegador
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert("Ficheiro 'dados.json' gerado com sucesso! Agora basta arrastá-lo para a pasta 'conteudo/noticias' no teu GitHub.");
  });
</script>

</body>
</html>
