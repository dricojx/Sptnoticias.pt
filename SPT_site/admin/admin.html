<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Edição Central — SPT</title>
  
  <!-- LINKS CORRIGIDOS E REAIS: Carrega o visual e os estilos do programa -->
  <link rel="stylesheet" href="https://jsdelivr.net" />
  
  <script>
    // Ativa a inicialização manual antes de carregar o programa
    window.CMS_MANUAL_INIT = true;
  </script>
</head>
<body>

  <!-- Contentor onde o ecrã do painel vai nascer -->
  <div id="nc-root"></div>

  <!-- LINK CORRIGIDO E REAL: Carrega o motor do programa Decap CMS -->
  <script src="https://jsdelivr.net"></script>

  <script>
    window.CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "dricojx/Sptnoticias.pt",
          branch: "main",
          auth_type: "implicit",
          // O teu Client ID real inserido no campo correto do Decap CMS
          app_id: "Ov23litHsFVmgnDwMHkA"
        },
        media_folder: "spt_site/imagens",
        public_folder: "imagens",
        collections: [{
          name: "noticias",
          label: "Notícias SPT",
          folder: "spt_site/conteudo/noticias",
          create: true,
          slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
          fields: [
            { label: "Título da Notícia", name: "title", widget: "string" },
            { label: "Categoria", name: "categoria", widget: "select", options: ["País", "Mundo", "Desporto", "Cultura", "Tecnologia"] },
            { label: "Hora de Exibição", name: "tempo_publicacao", widget: "string", default: "Hoje · 12:00" },
            { label: "Imagem de Destaque", name: "imagem_url", widget: "image" },
            { label: "Corpo da Notícia", name: "body", widget: "markdown" }
          ]
        }]
      }
    });
  </script>
</body>
</html>
