<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Edição Central — SPT</title>
  
  <link rel="stylesheet" href="https://jsdelivr.net" />
  <script>window.CMS_MANUAL_INIT = true;</script>
</head>
<body>
  <div id="nc-root"></div>
  <script src="https://jsdelivr.net"></script>
  <script>
    window.CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "dricojx/Sptnoticias.pt",
          branch: "main",
          // ESTA LINHA OBRIGA O BOTÃO A ABRIR A JANELA DO GITHUB SEM DAR NOT FOUND
          auth_type: "implicit"
        },
        media_folder: "spt_site/imagens",
        public_folder: "imagens",
        collections: [{
          name: "noticias",
          label: "Notícias SPT",
          folder: "spt_site/conteudo/noticias",
          create: true,
          slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
          fields: [
            { label: "Título da Notícia", name: "title", widget: "string" },
            { label: "Categoria", name: "categoria", widget: "select", options: ["País", "Mundo", "Desporto", "Cultura", "Tecnologia"] },
            { label: "Hora de Exibição", name: "tempo_publicacao", widget: "string", default: "Hoje · 12:00" },
            { label: "Imagem de Destaque", name: "imagem_url", widget: "image" },
            { label: "Corpo da Notícia", name: "body", widget: "markdown" }
          ]
        }]
      }
    });
  </script>
</body>
</html>
