<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Edição Central — SPT</title>
  
  <!-- Estilos oficiais estáveis que abrem sempre -->
  <link rel="stylesheet" href="https://unpkg.com" />
</head>
<body>

  <!-- O script agora é carregado com a configuração correta -->
  <script src="https://unpkg.com"></script>

  <script>
    // Inicia o painel diretamente sem depender de travas de ecrã
    CMS.init({
      config: {
        backend: {
          name: "github",
          repo: "dricojx/Sptnoticias.pt",
          branch: "main",
          auth_type: "implicit",
          app_id: "Ov23litHsFVmgnDwMHkA"
        },
        media_folder: "spt_site/imagens",
        public_folder: "imagens",
        collections: [{
          name: "noticias",
          label: "Notícias SPT",
          folder: "spt_site/conteudo/noticias",
          create: true,
          slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
          fields: [
            { label: "Título da Notícia", name: "title", widget: "string" },
            { label: "Categoria", name: "categoria", widget: "select", options: ["País", "Mundo", "Desporto", "Cultura", "Tecnologia"] },
            { label: "Hora de Exibição", name: "tempo_publicacao", widget: "string", default: "Hoje · 12:00" },
            { label: "Imagem de Destaque", name: "imagem_url", widget: "image" },
            { label: "Corpo da Notícia", name: "body", widget: "markdown" }
          ]
        }]
      }
    });
  </script>
</body>
</html>
