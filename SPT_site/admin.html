<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Edição Central — SPT</title>
  
  
  </script>
</head>
<body>

  <!-- 2. O programa principal do painel visual -->
  <script src="https://unpkg.com@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // 3. Ativa a criação manual do painel no navegador
    window.CMS_MANUAL_INIT = true;

    // 4. Injeta as configurações sem misturar chaves complicadas
    window.CMS.init({
      config: {
        backend: {
          name: "git-gateway", // Método oficial e seguro para sites estáticos
          branch: "main"
        },
        media_folder: "spt_site/imagens",
        public_folder: "imagens",
        collections: [{
          name: "noticias",
          label: "Notícias SPT",
          folder: "spt_site/conteudo/noticias",
          create: true,
          slug: "{{year}}-{{month}}-{{day}}-{{slug}}",
          fields: [
            { label: "Título da Notícia", name: "title", widget: "string" },
            { label: "Categoria", name: "categoria", widget: "select", options: ["País", "Mundo", "Desporto", "Cultura", "Tecnologia"] },
            { label: "Hora de Exibição", name: "tempo_publicacao", widget: "string", default: "Hoje · 12:00" },
            { label: "Imagem de Destaque", name: "imagem_url", widget: "image" },
            { label: "Corpo da Notícia", name: "body", widget: "markdown" }
          ]
        }]
      }
    });
  </script>
</body>
</html>
