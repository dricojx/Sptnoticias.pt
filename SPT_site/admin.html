<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Edição — SPT</title>
    <!-- Carrega o editor do TinaCMS direto da internet -->
    <script src="https://tina.io"></script>
</head>
<body>
    <div id="tina-admin-portal"></div>
    <script>
        // O painel configura-se aqui dentro sozinho, sem precisar de outros ficheiros
        window.TinaCMS.init({
            clientId: "28330561-c2e5-4c41-a7a7-3a75505b7a5c",
            token: "COLA_AQUI_O_TEU_TOKEN_DO_TINA_CLOUD",
            branch: "main",
            collections: [{
                label: "Notícias SPT",
                name: "noticias",
                path: "conteudo/noticias", 
                format: "json",
                fields: [
                    { type: "string", name: "titulo", label: "Título da Notícia", required: true },
                    { type: "string", name: "categoria", label: "Categoria", options: ["País", "Mundo", "Desporto", "Cultura"] },
                    { type: "string", name: "tempo_publicacao", label: "Hora de Exibição" },
                    { type: "image", name: "imagem_url", label: "Imagem de Destaque" },
                    { type: "rich-text", name: "conteudo", label: "Corpo da Notícia" }
                ]
            }]
        });
    </script>
</body>
</html>
